[package]
name = "deco-desktop"
version = "1.0.1"
description = "Deco desktop app with native Rust cleanup engine"
authors = ["Dendro-X0"]
license = "MIT"
repository = "https://github.com/Dendro-X0/Deco"
edition = "2021"
rust-version = "1.77"
default-run = "deco-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
tauri = { version = "2", features = ["image-ico", "image-png"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "deco_desktop"
path = "src/lib.rs"

[[bin]]
name = "deco-desktop"
path = "src/main.rs"

[[bin]]
name = "deco-bench"
path = "src/bin/deco-bench.rs"

[features]
default = []

[package.metadata.tauri]
