# Deco release pipeline
# - test: ubuntu + macos (typecheck, lint, CLI + Rust tests)
# - build matrix: Windows (msi/nsis), macOS (dmg), Linux (deb + AppImage) + per-OS CLI zips
# See docs/distribution/ci-and-release-platforms.md

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:cli

      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-tauri-deps

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm test:rust

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            cli_zip: deco-cli-win-x64.zip
            release_files: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              .artifacts/deco-cli-win-x64.zip
            primary_release: true
          - platform: macos
            os: macos-latest
            bundles: dmg
            cli_zip: deco-cli-macos-aarch64.zip
            release_files: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              .artifacts/deco-cli-macos-aarch64.zip
            primary_release: false
          - platform: linux
            os: ubuntu-latest
            bundles: deb,appimage
            cli_zip: deco-cli-linux-x64.zip
            release_files: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              .artifacts/deco-cli-linux-x64.zip
            primary_release: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Linux Tauri dependencies
        if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-tauri-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ matrix.platform != 'windows' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend + desktop bundles
        run: |
          pnpm build:frontend
          pnpm -F @dendro-x0/deco-desktop exec tauri build --bundles ${{ matrix.bundles }}

      - name: Build and package CLI
        run: |
          pnpm build:cli
          node scripts/package-cli.mjs

      - name: Zip CLI release archive
        run: node scripts/zip-cli-release.mjs
        env:
          CLI_ZIP_NAME: ${{ matrix.cli_zip }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: ${{ matrix.primary_release }}
          fail_on_unmatched_files: true
          files: ${{ matrix.release_files }}
